<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Booking | Monfre Studio Lamongan</title>
<meta name="description" content="Booking online Monfre Studio, foto studio di Lamongan.">
<meta name="theme-color" content="#111111">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23111'/%3E%3Ctext x='32' y='43' font-family='Georgia,serif' font-size='34' font-weight='700' fill='%23fff' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E">
<style>
  /* Booking Monfre Studio: menampilkan aplikasi Apps Script secara penuh layar. Software by Fahmi Yusuf */
  html,body{margin:0;height:100%;background:#fff;font-family:"Segoe UI",Roboto,Arial,sans-serif}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#fff}
  #muat{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#fff;transition:opacity .45s;padding:24px}
  #muat.hilang{opacity:0;pointer-events:none}
  .merek{font-family:Georgia,"Times New Roman",serif;font-size:44px;font-weight:700;letter-spacing:.01em;color:#111}
  .sub{font-size:12px;letter-spacing:.32em;color:#777;margin-top:-10px}
  .bar{width:150px;height:3px;background:#eee;overflow:hidden;border-radius:2px;margin-top:8px}
  .bar i{display:block;width:40%;height:100%;background:#111;animation:jalan 1.1s ease-in-out infinite}
  @keyframes jalan{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
  .ket{font-size:14px;color:#666}
  .lambat{display:none;font-size:13px;color:#666}
  .lambat a{color:#111;font-weight:700}
  @media (prefers-reduced-motion:reduce){.bar i{animation:none;width:100%}}
</style>
</head>
<body>
<div id="muat">
  <div class="merek">Monfré</div>
  <div class="sub">STUDIO</div>
  <div class="bar"><i></i></div>
  <div class="ket">Memuat halaman booking...</div>
  <div class="lambat" id="lambat">Memuat agak lama? <a id="langsung" href="#" target="_top">Buka langsung</a></div>
</div>
<iframe id="app" title="Booking Monfre Studio" allow="clipboard-write"></iframe>
<script>
  /* ====== LINK APLIKASI BOOKING (Apps Script /exec) ====== */
  var LINK_APPS_SCRIPT = 'https://script.google.com/macros/s/AKfycbxC2ceRvpNY3gXBVPpgs1u2AxVbqhFxDaYmj7hUXCN5hUBCey72M09JgqpLsu3c7NuIcA/exec';
  /* ======================================================== */

  // Parameter di alamat ikut diteruskan, mis. monfrestudio.github.io/?page=admin
  var url = LINK_APPS_SCRIPT + location.search;
  var frame = document.getElementById('app');
  document.getElementById('langsung').href = url;
  frame.src = url;
  frame.addEventListener('load', function () { document.getElementById('muat').className = 'hilang'; });
  setTimeout(function () { document.getElementById('lambat').style.display = 'block'; }, 8000);
</script>
</body>
</html>
