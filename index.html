<style>
  html,body{margin:0;height:100%;background:#faf7f2;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#2b2520}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;display:none}
  .tengah{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:20px}
  .tengah img{width:min(320px,70vw);height:auto;margin-bottom:16px}
  .tengah p{margin:6px 0;color:#7a6f66}
  .tengah a{display:inline-block;margin-top:14px;background:#8a5a2b;color:#fff;text-decoration:none;font-weight:700;padding:12px 22px;border-radius:10px}

<body>
<!-- Halaman khusus pelanggan Monfre Studio. Hanya membuka nota digital (?nota=KODE) dan progres pesanan (?progres=KODE), tidak ada halaman login tim. -->
<div class="tengah" id="layar"><div><img src="logo-nota.png" alt="Monfre Studio"><p id="msg">Memuat nota digital...</p></div></div>
<iframe id="app" title="Nota digital" allow="clipboard-write"></iframe>
<script>
  // alamat Web App aplikasi booking (akun Monfre)
  var BOOKING = 'https://script.google.com/macros/s/AKfycbxC2ceRvpNY3gXBVPpgs1u2AxVbqhFxDaYmj7hUXCN5hUBCey72M09JgqpLsu3c7NuIcA/exec';
  (function () {
    var q = location.search || '', m = /[?&]nota=([a-f0-9]{12,40})(?:&|$)/.exec(q), layar = document.getElementById('layar');
    // link progres pesanan dari nota / WA: ?progres=KODE&k=KUNCI -> aplikasi booking langsung menampilkan progres
    var pr = /[?&]progres=([A-Za-z0-9-]{3,40})(?:&|$)/.exec(q), kk = /[?&]k=([a-f0-9]{8,16})(?:&|$)/i.exec(q);
    if (pr) {
      document.title = 'Progres Pesanan Monfre Studio';
      document.getElementById('msg').textContent = 'Memuat progres pesanan...';
      var fp = document.getElementById('app');
      fp.title = 'Progres pesanan';
      fp.onload = function () { layar.style.display = 'none'; fp.style.display = 'block'; };
      fp.src = BOOKING + '?page=cek&kode=' + encodeURIComponent(pr[1]) + (kk ? '&k=' + kk[1].toLowerCase() : '');
      return;
    }
    if (!m) {
      layar.innerHTML = '<div><img src="logo-nota.png" alt="Monfre Studio"><p>Nota digital Monfre Studio</p>' +
        '<p>Buka link nota yang kami kirim lewat WhatsApp untuk melihat nota Anda.</p><a href="https://www.monfrestudio.com">Kunjungi www.monfrestudio.com</a></div>';
      return;
    }
    var f = document.getElementById('app');
    f.onload = function () { layar.style.display = 'none'; f.style.display = 'block'; };
    f.src = 'https://script.google.com/macros/s/AKfycbzeJGj5eF_MBaNJWPkCJysB2p0PLfp4i1ur4UyASo8RHzivRJxMFlIRzGyBsU-N7NhX/exec?nota=' + m[1];
    setTimeout(function () {
      if (layar.style.display !== 'none') document.getElementById('msg').textContent = 'Masih memuat... Kalau tidak muncul, muat ulang halaman ini.';
    }, 20000);
  })();
</script>
</body>
